name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.4.3). Must already exist or will be created.'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Android keystore
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/innercore-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=/tmp/innercore-release.jks
          EOF

      - name: Flutter pub get
        working-directory: client
        run: flutter pub get

      - name: Build release APK
        working-directory: client
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.innercore.art \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Rename APK
        working-directory: client
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/innercore-${{ steps.tag.outputs.tag }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: InnerCore ${{ steps.tag.outputs.tag }}
          files: client/out/innercore-${{ steps.tag.outputs.tag }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
